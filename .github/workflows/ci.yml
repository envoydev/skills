name: test

# The test half of the gate - the sibling lint.yml runs the parity lint on every push
# and PR; this runs the node test suite (installer source/stamp paths, selection closure,
# stack graph, plugin skills, analyze-usage) so a develop -> main merge (the release act -
# it republishes the rolling 'latest' archive) only ever promotes a green tree.
#
# Lock-free like lint.yml (the root package-lock.json is deliberately untracked).
#
# THREE operating systems, because the suite drives real hooks through real paths and the
# platforms disagree about them: separators, an absolute path's shape, case sensitivity, and
# which spelling of a Windows path node resolves against the current drive. Ubuntu alone said
# green while `npm test` on Windows ran ZERO tests and exited 0 - the script passed its glob
# through the shell, and cmd.exe does not strip single quotes, so node matched nothing and the
# gate reported success. A gate that cannot fail is not a gate.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Full fetch + a local main ref: the installer tests exercise the fallback clone,
      # which is pinned to -b main (the release branch), against THIS checkout - so
      # refs/heads/main must exist locally even when the run is for a develop push/PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
